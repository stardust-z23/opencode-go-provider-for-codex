      <path d="M -39 -88 C -46 -64 -43 -36 -25 -14 L 2 -48 L 2 -72 Z" fill="url(#b5_f2)"/>
      <path d="M 2 -118 L 40 -90 C 46 -66 38 -38 22 -22 L 2 -48 L 2 -72 Z" fill="url(#b5_f3)"/>
