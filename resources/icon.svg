      <path d="M -39 -88 C -46 -64 -43 -36 -25 -14 L 2 -48 L 2 -72 Z" fill="url(#b0_f2)"/>
      <path d="M 2 -118 L 40 -90 C 46 -66 38 -38 22 -22 L 2 -48 L 2 -72 Z" fill="url(#b0_f3)"/>
      <path d="M -25 -14 L 2 -48 L 22 -22 L -6 -10 C -15 -10 -21 -11 -25 -14 Z" fill="url(#b0_f4)"/>
      <path d="M 2 -118 L 2 -48 M -39 -88 L 2 -72 M -25 -14 L 2 -48 L 22 -22" fill="none" stroke="#befcff" stroke-opacity="0.48" stroke-width="1.35"/>
