      <path d="M 2 -118 L 2 -48 M -39 -88 L 2 -72 M -25 -14 L 2 -48 L 22 -22" fill="none" stroke="#a8f6ff" stroke-opacity="0.46" stroke-width="1.35"/>
      <path d="M -25 -14 C -43 -36 -46 -64 -39 -88 Q -37 -94 -32 -98 L 2 -118 L 40 -90" fill="none" stroke="#c3f9ff" stroke-opacity="0.52" stroke-width="1.45"/>
