      <path d="M -39 -88 C -46 -64 -43 -36 -25 -14 L 2 -48 L 2 -72 Z" fill="url(#b3_f2)"/>
      <path d="M 2 -118 L 40 -90 C 46 -66 38 -38 22 -22 L 2 -48 L 2 -72 Z" fill="url(#b3_f3)"/>
      <path d="M -25 -14 L 2 -48 L 22 -22 L -6 -10 C -15 -10 -21 -11 -25 -14 Z" fill="url(#b3_f4)"/>
      <path d="M 2 -118 L 2 -48 M -39 -88 L 2 -72 M -25 -14 L 2 -48 L 22 -22" fill="none" stroke="#82dcff" stroke-opacity="0.4" stroke-width="1.35"/>
